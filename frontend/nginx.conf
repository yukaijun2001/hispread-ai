map $http_x_forwarded_proto $trusted_external_scheme {
  default $scheme;
  https https;
  http http;
}
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
server {
  listen 8080;
  server_name _;
  server_tokens off;
  absolute_redirect off;
  keepalive_timeout 75s;
  keepalive_requests 1000;
  sendfile on;
  tcp_nopush on;
  client_max_body_size 12m;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Preserve only the trusted TLS terminator's scheme when it is installed in front of this service.
    proxy_set_header X-Forwarded-Proto $trusted_external_scheme;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_buffering off;
  }
  location = /index.html { add_header Cache-Control "no-store"; try_files $uri =404; }
  location ~* \.(js|css|png|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
