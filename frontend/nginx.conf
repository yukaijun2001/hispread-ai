map $http_x_forwarded_proto $trusted_external_scheme {
  default $scheme;
  https https;
  http http;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 12m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Preserve only the trusted TLS terminator's scheme when it is installed in front of this service.
    proxy_set_header X-Forwarded-Proto $trusted_external_scheme;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_buffering off;
  }
  location = /index.html { add_header Cache-Control "no-store"; try_files $uri =404; }
  location ~* \.(js|css|png|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
