server:
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 12MB
spring:
  datasource:
    username: ${DATABASE_USER:hispread}
  session:
    timeout: ${SESSION_TIMEOUT:8h}
app:
  bootstrap-mode: production
  payments:
    online-enabled: false
    sandbox-enabled: false
logging:
  level:
    root: INFO
    org.springframework.web: WARN
